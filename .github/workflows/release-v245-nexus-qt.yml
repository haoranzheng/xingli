name: Xingli v2.4.5 MO2 Nexus repair crash and Qt compatibility
on:
  pull_request:
    branches: [main]
    paths:
      - 'development/v2.4.5/**'
      - '.github/workflows/release-v245-nexus-qt.yml'
  push:
    branches: [main]
    paths:
      - 'development/v2.4.5/**'
      - '.github/workflows/release-v245-nexus-qt.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qt-and-release:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test pure metadata logic and sorting regression
        shell: pwsh
        run: |
          python development/v2.4.5/test_nexus_repair_service.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/v2.4.4/test_nexus_archive_metadata.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/v2.4.3/test_mirror_reliability.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/v2.4.2/test_raw_sort.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test actual Qt6 repair dialog offscreen
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'PyQt6==6.8.1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/v2.4.5/test_nexus_repair_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Qt5 repair dialog with isolated binding
        shell: pwsh
        run: |
          python -m pip uninstall --yes PyQt6 PyQt6-Qt6 PyQt6-sip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check 'PyQt5==5.15.11'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/v2.4.5/test_nexus_repair_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build v2.4.5 release
        shell: pwsh
        run: |
          python development/v2.4.5/build_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify package and exact change scope
        shell: pwsh
        run: |
          @'
          import ast,hashlib,json,pathlib,zipfile
          root=pathlib.Path('.')
          m=json.loads((root/'update/latest.json').read_text(encoding='utf-8'))
          p=m['package']; f=root/'update/releases'/p['filename']
          blob=f.read_bytes()
          assert m['version']=='2.4.5'
          assert len(blob)==p['size']
          assert hashlib.sha256(blob).hexdigest()==p['sha256']
          assert p['mirrors'][0]['url'].startswith('https://gitee.com/')
          with zipfile.ZipFile(root/'update/releases/xingli_Little_assistant_v2.4.4_update.zip') as old,zipfile.ZipFile(f) as new:
            assert old.testzip() is None and new.testzip() is None
            a={i.filename:old.read(i) for i in old.infolist() if not i.is_dir()}
            b={i.filename:new.read(i) for i in new.infolist() if not i.is_dir()}
            assert not (set(a)-set(b))
            assert {x for x in a if a[x]!=b[x]}=={
              'xingli_Little_assistant/consolidation_controller.py',
              'xingli_Little_assistant/mod_manager.py',
              'xingli_Little_assistant/version.ini'}
            assert set(b)-set(a)=={
              'xingli_Little_assistant/nexus_repair_service.py',
              'xingli_Little_assistant/nexus_repair_ui.py',
              'xingli_Little_assistant/CHANGELOG_v2.4.5.md'}
            for name,data in b.items():
              if name.endswith('.py'):
                ast.parse(data.decode('utf-8-sig'),filename=name,feature_version=(3,8))
          print('V245_RELEASE_VALID',len(blob),p['sha256'])
          '@ | Set-Content -LiteralPath validate_v245.py -Encoding UTF8
          python validate_v245.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish only after merge and all tests pass
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'xingli-245'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item update/latest.json "$dir/latest.json"
          Copy-Item update/releases/xingli_Little_assistant_v2.4.5_update.zip "$dir/update.zip"
          git fetch origin main
          git checkout -B publish-v245 origin/main
          @'
          import json,pathlib
          m=json.loads(pathlib.Path('update/latest.json').read_text(encoding='utf-8-sig'))
          if m.get('version') not in ('2.4.4','2.4.5'):
            raise SystemExit('Unexpected updater version: '+str(m.get('version')))
          '@ | Set-Content -LiteralPath main_guard_v245.py -Encoding UTF8
          python main_guard_v245.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$dir/latest.json" update/latest.json
          Copy-Item "$dir/update.zip" update/releases/xingli_Little_assistant_v2.4.5_update.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/latest.json update/releases/xingli_Little_assistant_v2.4.5_update.zip
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Release Xingli v2.4.5 Nexus repair stability"
          git push origin HEAD:main
