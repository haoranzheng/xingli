name: Verify Xingli v2.2.0 release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'update/latest.json'
      - 'update/releases/xingli_Little_assistant_v2.2.0_update.zip'
      - '.github/workflows/publish-xingli-v2.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Verify published v2.2.0 package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import ast
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          manifest = json.loads(Path('update/latest.json').read_text(encoding='utf-8-sig'))
          if manifest.get('schema') != 2 or manifest.get('product') != 'xingli_Little_assistant':
              raise SystemExit('unexpected update manifest identity')
          if manifest.get('channel') != 'stable' or manifest.get('version') != '2.2.0':
              raise SystemExit('update/latest.json is not stable 2.2.0')

          package = manifest.get('package') or {}
          filename = package.get('filename')
          if filename != 'xingli_Little_assistant_v2.2.0_update.zip':
              raise SystemExit('unexpected package filename: {!r}'.format(filename))
          path = Path('update/releases') / filename
          if not path.is_file():
              raise SystemExit('published ZIP missing')
          data = path.read_bytes()
          sha = hashlib.sha256(data).hexdigest()
          if sha != package.get('sha256'):
              raise SystemExit('published ZIP sha256 mismatch')
          if len(data) != package.get('size'):
              raise SystemExit('published ZIP size mismatch')

          with zipfile.ZipFile(str(path)) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit('ZIP integrity failure: ' + bad)
              names = z.namelist()
              required = [
                  'xingli_Little_assistant/pgpatcher_adapter.py',
                  'xingli_Little_assistant/instance_identity.py',
                  'xingli_Little_assistant/onboarding_state.py',
                  'xingli_Little_assistant/CHANGELOG_v2.2.0.md',
                  'xingli_Little_assistant/consolidation_controller.py',
                  'xingli_Little_assistant/tutorial_data.py',
              ]
              missing = [x for x in required if x not in names]
              if missing:
                  raise SystemExit('release content missing: {!r}'.format(missing))
              forbidden = []
              for name in names:
                  low = name.replace('\\', '/').lower()
                  base = low.rsplit('/', 1)[-1]
                  if '/__pycache__/' in '/' + low or '/_xinglistate/' in '/' + low:
                      forbidden.append(name)
                  elif base.endswith(('.pyc', '.log', '.download')) or base in {'onboarding.json', 'pending_update.json', 'pending_health_repair.json'}:
                      forbidden.append(name)
              if forbidden:
                  raise SystemExit('runtime state leaked into published ZIP: ' + ', '.join(forbidden[:20]))

              py_names = [x for x in names if x.startswith('xingli_Little_assistant/') and x.endswith('.py')]
              for name in py_names:
                  source = z.read(name).decode('utf-8-sig')
                  try:
                      ast.parse(source, filename=name, feature_version=(3, 8))
                  except TypeError:
                      ast.parse(source, filename=name, feature_version=8)

              controller = z.read('xingli_Little_assistant/consolidation_controller.py').decode('utf-8-sig')
              adapter = z.read('xingli_Little_assistant/pgpatcher_adapter.py').decode('utf-8-sig')
              tutorial = z.read('xingli_Little_assistant/tutorial_data.py').decode('utf-8-sig')
              changelog = z.read('xingli_Little_assistant/CHANGELOG_v2.2.0.md').decode('utf-8-sig')
              for token in ['VersionInfo(2, 2, 0)', 'PBR / PGPatcher', 'def launch_pgpatcher', 'Backported Extended ESL Support (BEES)']:
                  if token not in controller:
                      raise SystemExit('controller release gate missing: ' + token)
              for token in ['PGPatcher_Output', 'DynDOLOD', 'organizer.startApplication(exe, [], cwd)', 'set_active(names, False, verify=False)']:
                  if token not in adapter:
                      raise SystemExit('PGPatcher release gate missing: ' + token)
              if 'Backported Extended ESL Support (BEES)' not in tutorial or 'Backported Extended ESL Support (BEES)' not in changelog:
                  raise SystemExit('BEES release guidance missing from tutorial/changelog')

          print('Published Xingli Assistant v2.2.0 verification: PASS')
          print('size:', len(data))
          print('sha256:', sha)
          '@ | Set-Content -Encoding UTF8 .verify_v220.py
          python .verify_v220.py
