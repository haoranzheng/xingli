name: Publish Xingli v2.1.0 update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'release_build/v2.1.0/**'
      - '.github/workflows/publish-xingli-v2.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify v2.0.6 base package
        shell: bash
        run: |
          echo "e5b266eb6756eb82fdb18f9484a3b092e3e3cd973265b00a0e7969d6b5f47be4  update/releases/xingli_Little_assistant_v2.0.6_update.zip" | sha256sum -c -
          unzip -t update/releases/xingli_Little_assistant_v2.0.6_update.zip >/dev/null

      - name: Rebuild and validate v2.1.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release_work
          mkdir -p .release_work
          python3 - <<'PYBUILD'
          import zipfile
          with zipfile.ZipFile('update/releases/xingli_Little_assistant_v2.0.6_update.zip') as z:
              z.extractall('.release_work')
          PYBUILD

          python3 - <<'PYBUILD'
          from pathlib import Path
          import base64, zlib
          parts = sorted(Path('release_build/v2.1.0').glob('patch.part.*'))
          if not parts:
              raise SystemExit('v2.1.0 patch parts missing')
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          Path('/tmp/xingli-v210.patch').write_bytes(patch)
          print('patch parts:', len(parts), 'encoded chars:', len(encoded), 'patch bytes:', len(patch))
          PYBUILD
          patch -p1 -d .release_work < /tmp/xingli-v210.patch

          python3 - <<'PYBUILD'
          from pathlib import Path
          import ast, hashlib, json, re, zipfile

          root = Path('.release_work/xingli_Little_assistant')
          if not (root / '__init__.py').is_file():
              raise SystemExit('plugin root missing after patch')

          py_files = sorted(root.rglob('*.py'))
          for p in py_files:
              source = p.read_text(encoding='utf-8-sig')
              try:
                  ast.parse(source, filename=str(p), feature_version=(3, 8))
              except TypeError:
                  ast.parse(source, filename=str(p), feature_version=8)
          print('Python 3.8 AST gate: PASS', len(py_files), 'files')

          forbidden = {'pluginList', 'onPluginStateChanged', 'onModStateChanged', 'waitForApplication'}
          findings = []
          for p in py_files:
              tree = ast.parse(p.read_text(encoding='utf-8-sig'))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call):
                      fn = node.func
                      name = fn.attr if isinstance(fn, ast.Attribute) else (fn.id if isinstance(fn, ast.Name) else '')
                      if name in forbidden:
                          findings.append(f'{p.name}:{node.lineno}:{name}')
          if findings:
              raise SystemExit('forbidden MO2 runtime calls: ' + ', '.join(findings))
          print('MO2 2.4.4 runtime API gate: PASS')

          text_files = [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.py','.ps1','.md','.ini','.json','.txt'}]
          privacy_patterns = {
              'author machine path': re.compile(r'E:[\\/]XLSkyrim3\\.0', re.I),
              'windows user path': re.compile(r'C:[\\/]Users[\\/]', re.I),
              'known author machine username': re.compile(r'\\bm1660\\b', re.I),
              'share tracking parameter': re.compile(r'vd_source=', re.I),
              'github token': re.compile(r'(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})'),
              'openai style secret': re.compile(r'\\bsk-[A-Za-z0-9_-]{20,}'),
          }
          privacy_hits = []
          for p in text_files:
              text = p.read_text(encoding='utf-8-sig', errors='ignore')
              for label, pattern in privacy_patterns.items():
                  if pattern.search(text):
                      privacy_hits.append(f'{label}:{p.relative_to(root)}')
          if privacy_hits:
              raise SystemExit('privacy gate failed: ' + ', '.join(privacy_hits))

          runtime_hits = []
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              rel = p.relative_to(root)
              parts = [x.lower() for x in rel.parts]
              name = p.name.lower()
              if any(x in {'logs', '__pycache__', '_xingliupdates'} for x in parts):
                  runtime_hits.append(str(rel))
              elif name.endswith(('.log', '.download', '.pyc')) or '.log.' in name:
                  runtime_hits.append(str(rel))
              elif name == 'pending_update.json':
                  runtime_hits.append(str(rel))
          if runtime_hits:
              raise SystemExit('runtime artifacts leaked into player package: ' + ', '.join(runtime_hits[:20]))
          print('Runtime artifact gate: PASS')

          forbidden_release_paths = [
              root / 'author_tools',
              root / 'UPDATE_PUBLISH_GUIDE_CN.md',
              root / 'MODPACK_UPDATE_GUIDE_CN.md',
              root / 'update_manifest.example.json',
          ]
          leaked = [str(p.relative_to(root)) for p in forbidden_release_paths if p.exists()]
          if leaked:
              raise SystemExit('author-only files leaked into player build: ' + ', '.join(leaked))
          print('Privacy/release hygiene gate: PASS')

          updater = (root / 'auto_updater.py').read_text(encoding='utf-8')
          hygiene_tokens = [
              'cleanup_update_workspace',
              'Cleanup-AfterSuccess',
              '_validate_update_archive_hygiene',
              'UPDATE_BACKUP_LIMIT = 1',
              'QTimer.singleShot(0, dialog.check_updates)',
              '立即安装已下载更新',
              'self.progress.canceled.connect(self.download_thread.requestInterruption)',
              'ALLOWED_UPDATE_HOSTS',
          ]
          missing = [token for token in hygiene_tokens if token not in updater]
          if missing:
              raise SystemExit('update hygiene/security guard missing: ' + repr(missing))

          stability = (root / 'stability.py').read_text(encoding='utf-8')
          if 'maxBytes=1 * 1024 * 1024, backupCount=1' not in stability:
              raise SystemExit('log rotation limit missing')

          modpack = (root / 'modpack_updater.py').read_text(encoding='utf-8')
          for token in ['ALLOWED_MANIFEST_HOSTS', 'ALLOWED_DOWNLOAD_HOSTS']:
              if token not in modpack:
                  raise SystemExit('modpack URL safety guard missing: ' + token)

          health = (root / 'modpack_health.py').read_text(encoding='utf-8')
          repair = (root / 'modpack_repair.py').read_text(encoding='utf-8')
          health_tokens = [
              'SCHEMA_VERSION = 2',
              'include_repair_data=True',
              'class RepairPreviewDialog',
              '一键修复安全项目',
              'ModpackRepairService',
          ]
          repair_tokens = [
              'class ModpackRepairService',
              'pending_health_repair.json',
              'self.mod_tx.apply',
              'restore_states',
              'setPriority',
              'content_b64',
              'recover_pending',
          ]
          missing = [token for token in health_tokens if token not in health]
          missing += [token for token in repair_tokens if token not in repair]
          if missing:
              raise SystemExit('health repair guard missing: ' + repr(missing))
          destructive = [token for token in ['installMod(', 'removeMod('] if token in repair]
          if destructive:
              raise SystemExit('health repair must not install/remove MODs: ' + repr(destructive))
          print('Health safe-repair gate: PASS')

          entries = []
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel = p.relative_to(root).as_posix()
              entries.append(f'{rel}\0{hashlib.sha256(p.read_bytes()).hexdigest()}\n')
          tree_digest = hashlib.sha256(''.join(entries).encode('utf-8')).hexdigest()
          expected = '5da43188af6e504a9101922cd1649f8ea5ea424388d152940eef10e2e4bae7dd'
          print('source tree digest:', tree_digest)
          if tree_digest != expected:
              raise SystemExit(f'source tree digest mismatch: {tree_digest}')

          out = Path('update/releases/xingli_Little_assistant_v2.1.0_update.zip')
          out.parent.mkdir(parents=True, exist_ok=True)
          if out.exists():
              out.unlink()
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(x for x in Path('.release_work').rglob('*') if x.is_file()):
                  z.write(p, p.relative_to('.release_work').as_posix())

          with zipfile.ZipFile(out, 'r') as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit('zip integrity failure: ' + bad)
              leaked_names = []
              for name in z.namelist():
                  lower = name.replace('\\', '/').lower()
                  base = lower.rsplit('/', 1)[-1]
                  if '/logs/' in '/' + lower or '/__pycache__/' in '/' + lower or '/_xingliupdates/' in '/' + lower:
                      leaked_names.append(name)
                  elif base.endswith(('.log', '.download', '.pyc')) or '.log.' in base or base == 'pending_update.json':
                      leaked_names.append(name)
              if leaked_names:
                  raise SystemExit('runtime artifacts present in final ZIP: ' + ', '.join(leaked_names[:20]))
          print('Final ZIP runtime artifact gate: PASS')

          data = out.read_bytes()
          package_sha = hashlib.sha256(data).hexdigest()
          package_size = len(data)
          print('package size:', package_size)
          print('package sha256:', package_sha)

          manifest = {
              'schema': 2,
              'product': 'xingli_Little_assistant',
              'channel': 'stable',
              'version': '2.1.0',
              'title': '星黎 MO2 小助手 2.1.0',
              'published_at': '2026-09-09T13:04:00+08:00',
              'changelog': '整合包健康检查升级为可回滚安全修复：支持 MOD 启停、同 MOD 集合下的左侧顺序、以及基准配置文件精确恢复；修复前预览、失败自动回滚、异常退出后恢复。缺失/新增 MOD、安装卸载与存档始终只报告不自动处理。',
              'package': {
                  'filename': out.name,
                  'size': package_size,
                  'sha256': package_sha,
                  'mirrors': [
                      {
                          'name': 'Gitee 国内主源',
                          'url': 'https://gitee.com/HR-world/xingli/raw/main/update/releases/' + out.name,
                      },
                      {
                          'name': 'GitHub 备用源',
                          'url': 'https://raw.githubusercontent.com/haoranzheng/xingli/main/update/releases/' + out.name,
                      },
                  ],
              },
          }
          Path('update/latest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PYBUILD

          unzip -t update/releases/xingli_Little_assistant_v2.1.0_update.zip >/dev/null

      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/latest.json update/releases/xingli_Little_assistant_v2.1.0_update.zip
          if git diff --cached --quiet; then
            echo "No release changes"
            exit 0
          fi
          git commit -m "Publish Xingli Assistant v2.1.0 update"
          git push
