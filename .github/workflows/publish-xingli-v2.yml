name: Publish Xingli v2.0.3 update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'release_build/v2.0.3/**'
      - '.github/workflows/publish-xingli-v2.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify v2.0.2 base package
        shell: bash
        run: |
          echo "53c7aa9ba4cdf870984a46fd005ea239aca6831400b0cdd8b830af41ecf9ae03  update/releases/xingli_Little_assistant_v2.0.2_update.zip" | sha256sum -c -
          unzip -t update/releases/xingli_Little_assistant_v2.0.2_update.zip >/dev/null

      - name: Rebuild and validate v2.0.3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release_work
          mkdir -p .release_work
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('update/releases/xingli_Little_assistant_v2.0.2_update.zip') as z:
              z.extractall('.release_work')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import base64, zlib
          encoded = Path('release_build/v2.0.3/patch.zb64').read_text(encoding='ascii').strip()
          patch = zlib.decompress(base64.b64decode(encoded))
          Path('/tmp/xingli-v203.patch').write_bytes(patch)
          PY
          patch -p1 -d .release_work < /tmp/xingli-v203.patch

          python3 - <<'PY'
          from pathlib import Path
          import ast, hashlib, json, zipfile

          root = Path('.release_work/xingli_Little_assistant')
          if not (root / '__init__.py').is_file():
              raise SystemExit('plugin root missing after patch')

          py_files = sorted(root.rglob('*.py'))
          for p in py_files:
              source = p.read_text(encoding='utf-8-sig')
              try:
                  ast.parse(source, filename=str(p), feature_version=(3, 8))
              except TypeError:
                  ast.parse(source, filename=str(p), feature_version=8)
          print('Python 3.8 AST gate: PASS', len(py_files), 'files')

          # MO2 2.4.4 dangerous runtime API gate.
          forbidden = {'pluginList', 'onPluginStateChanged', 'onModStateChanged', 'waitForApplication'}
          findings = []
          for p in py_files:
              tree = ast.parse(p.read_text(encoding='utf-8-sig'))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call):
                      fn = node.func
                      name = fn.attr if isinstance(fn, ast.Attribute) else (fn.id if isinstance(fn, ast.Name) else '')
                      if name in forbidden:
                          findings.append(f'{p.name}:{node.lineno}:{name}')
          if findings:
              raise SystemExit('forbidden MO2 runtime calls: ' + ', '.join(findings))
          print('MO2 2.4.4 runtime API gate: PASS')

          lod = (root / 'lod_pipeline.py').read_text(encoding='utf-8')
          required_tokens = [
              '_apply_stage_mod_policy(retry, preserve_saved=True)',
              '_restore_pipeline_mod_states("流水线全部完成")',
              '_restore_pipeline_mod_states("流水线失败停止")',
              'pipeline_original_mod_states',
          ]
          missing = [token for token in required_tokens if token not in lod]
          if missing:
              raise SystemExit('LOD state restore guard missing: ' + repr(missing))

          entries = []
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel = p.relative_to(root).as_posix()
              entries.append(f'{rel}\0{hashlib.sha256(p.read_bytes()).hexdigest()}\n')
          tree_digest = hashlib.sha256(''.join(entries).encode('utf-8')).hexdigest()
          expected = 'ab2623667237f3e660642967c4379360d14ccebe88f67f7319f3ece7c59aa7ad'
          print('source tree digest:', tree_digest)
          if tree_digest != expected:
              raise SystemExit(f'source tree digest mismatch: {tree_digest}')

          out = Path('update/releases/xingli_Little_assistant_v2.0.3_update.zip')
          out.parent.mkdir(parents=True, exist_ok=True)
          if out.exists():
              out.unlink()
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(x for x in Path('.release_work').rglob('*') if x.is_file()):
                  z.write(p, p.relative_to('.release_work').as_posix())

          with zipfile.ZipFile(out, 'r') as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit('zip integrity failure: ' + bad)

          data = out.read_bytes()
          package_sha = hashlib.sha256(data).hexdigest()
          package_size = len(data)
          print('package size:', package_size)
          print('package sha256:', package_sha)

          manifest = {
              'schema': 2,
              'product': 'xingli_Little_assistant',
              'channel': 'stable',
              'version': '2.0.3',
              'title': '星黎 MO2 小助手 2.0.3',
              'published_at': '2026-09-09T09:53:00+08:00',
              'changelog': '正式启用整合包 3.3.1 多网盘更新提示与持久版本记录；修复 Grass/LOD 临时 MOD 状态在完成后不能可靠恢复的问题，并增加流水线级最终状态校准。',
              'package': {
                  'filename': out.name,
                  'size': package_size,
                  'sha256': package_sha,
                  'mirrors': [
                      {
                          'name': 'Gitee 国内主源',
                          'url': 'https://gitee.com/HR-world/xingli/raw/main/update/releases/' + out.name,
                      },
                      {
                          'name': 'GitHub 备用源',
                          'url': 'https://raw.githubusercontent.com/haoranzheng/xingli/main/update/releases/' + out.name,
                      },
                  ],
              },
          }
          Path('update/latest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

          unzip -t update/releases/xingli_Little_assistant_v2.0.3_update.zip >/dev/null

      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/latest.json update/releases/xingli_Little_assistant_v2.0.3_update.zip
          if git diff --cached --quiet; then
            echo "No release changes"
            exit 0
          fi
          git commit -m "Publish Xingli Assistant v2.0.3 update"
          git push
