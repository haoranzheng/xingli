name: Inspect v2.4.7 runtime integration points
on:
  push:
    branches: [feature/v248-profile-download-disable-sort-20261109]
    paths:
      - 'development/v2.4.8/inspect_runtime.py'
      - '.github/workflows/inspect-v248-runtime.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python development/v2.4.8/inspect_runtime.py
