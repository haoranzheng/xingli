name: Xingli v2.4.2 raw TXT sorting updater
on:
  push:
    branches: [feature/sort-raw-txt-direct-publish-20261014]
    paths:
      - '.github/workflows/release-v242-sort-raw.yml'
      - 'development/v2.4.2/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-build-publish:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Test direct raw TXT publication and MO2-safe backup downloads
        shell: pwsh
        run: |
          python development/v2.4.2/test_raw_sort.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/v2.4.1/test_sort_updates.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build v2.4.2 assistant ZIP
        shell: pwsh
        run: |
          python development/v2.4.2/build_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify ZIP, checksum, isolated change list and matching catalog
        shell: pwsh
        run: |
          @'
          import ast,hashlib,json,pathlib,zipfile
          root=pathlib.Path('.')
          manifest=json.loads((root/'update/latest.json').read_text(encoding='utf-8'))
          p=manifest['package']
          blob=(root/'update/releases'/p['filename']).read_bytes()
          assert manifest['version']=='2.4.2'
          assert p['size']==len(blob)
          assert hashlib.sha256(blob).hexdigest()==p['sha256']
          assert p['mirrors'][0]['url'].startswith('https://gitee.com/')
          with zipfile.ZipFile(root/'update/releases/xingli_Little_assistant_v2.4.1_update.zip') as old,zipfile.ZipFile(root/'update/releases'/p['filename']) as new:
            a={f.filename:old.read(f) for f in old.infolist() if not f.is_dir()}
            b={f.filename:new.read(f) for f in new.infolist() if not f.is_dir()}
            assert old.testzip() is None and new.testzip() is None
            assert set(a)-set(b)==set()
            assert {x for x in a if a[x]!=b[x]}=={
              'xingli_Little_assistant/consolidation_controller.py',
              'xingli_Little_assistant/sort_update_core.py',
              'xingli_Little_assistant/version.ini'}
            assert set(b)-set(a)=={'xingli_Little_assistant/CHANGELOG_v2.4.2.md'}
            for name,value in b.items():
              if name.endswith('.py'):
                ast.parse(value.decode('utf-8-sig'),filename=name,feature_version=(3,8))
            ctl=b['xingli_Little_assistant/consolidation_controller.py'].decode('utf-8')
            assert 'sort_update_ui.startup_check(self)' in ctl
            assert 'mod_update_ui.maybe_auto_check(self)' not in ctl
            assert 'mobase.VersionInfo(2, 4, 2)' in ctl
            sort=b['xingli_Little_assistant/sort_update_core.py'].decode('utf-8')
            assert 'if "files" in record:' in sort
            assert 'def install_as_backups' in sort
          print('V242_RAW_ZIP_DIFF_SHA256_PASS',len(blob),p['sha256'])
          '@ | Set-Content -LiteralPath validate_v242.py -Encoding UTF8
          python validate_v242.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish validated version update to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'xingli-242'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item update/latest.json "$dir/latest.json"
          Copy-Item update/releases/xingli_Little_assistant_v2.4.2_update.zip "$dir/update.zip"
          git fetch origin main
          git checkout -B publish-v242 origin/main
          @'
          import pathlib,json
          d=json.loads(pathlib.Path('update/latest.json').read_text(encoding='utf-8-sig'))
          if d.get('version') not in ('2.4.1','2.4.2'):
            raise SystemExit('Unexpected main version: '+str(d.get('version')))
          '@ | Set-Content -LiteralPath main_guard_v242.py -Encoding UTF8
          python main_guard_v242.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$dir/latest.json" update/latest.json
          Copy-Item "$dir/update.zip" update/releases/xingli_Little_assistant_v2.4.2_update.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/latest.json update/releases/xingli_Little_assistant_v2.4.2_update.zip
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Release Xingli v2.4.2 direct raw sorting files"
          git push origin HEAD:main
