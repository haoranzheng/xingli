name: Inspect packaged v2.4.9 window ownership
on:
  pull_request:
    branches: [main]
    paths:
      - 'development/v2.5.0/inspect_ui.py'
      - '.github/workflows/inspect-v250-dialogs.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python development/v2.5.0/inspect_ui.py
