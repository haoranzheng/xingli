name: Build v2.2 clean first-run candidate

on:
  push:
    branches: [feature/2.2-clean-first-run]
    paths:
      - 'release_build/v2.2.0/**'
      - '.github/workflows/build-v2.2-clean-first-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate Phase A candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python release_build/v2.2.0/validate_and_build.py

      - name: Upload validated candidate
        uses: actions/upload-artifact@v4
        with:
          name: xingli-v2.2.0-clean-first-run-candidate
          path: |
            .work/xingli_Little_assistant_v2.2.0_candidate.zip
            .work/candidate-manifest.json
            .work/phase-a-test-report.txt
          if-no-files-found: error
