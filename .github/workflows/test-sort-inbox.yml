name: Test single-folder sorting inbox upload
on:
  push:
    branches: [feature/sort-inbox-one-step-upload]
    paths:
      - '.github/workflows/test-sort-inbox.yml'
      - 'development/v2.4.2/stage_inbox_sort.py'
      - 'development/v2.4.2/test_sort_inbox.py'
  pull_request:
    branches: [main]
    paths:
      - '.gitattributes'
      - 'sort/latest.json'
      - 'sort/releases/**/*.txt'
      - 'development/v2.4.2/**'
      - '.github/workflows/*sort*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check native raw text staging and version conflict protection
        shell: pwsh
        run: |
          python development/v2.4.2/test_sort_inbox.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/v2.4.2/test_raw_sort.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/v2.4.2/test_staged_sort_manifest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
